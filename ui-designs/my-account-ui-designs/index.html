<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoReservo — Sistema de Diseños UI (Mi Cuenta & Perfil)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/design-tokens.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #EBE7DC;
    }
    .top-navbar {
      background-color: var(--brand-deep);
      color: #FFFFFF;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(198, 242, 59, 0.35);
      flex-shrink: 0;
    }
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar-nav {
      width: 320px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 16px;
      flex-shrink: 0;
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-foreground);
      margin: 16px 0 8px 8px;
    }
    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--foreground);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      margin-bottom: 4px;
    }
    .nav-btn:hover {
      background-color: var(--muted);
    }
    .nav-btn.active {
      background-color: #EBF8D3;
      border-color: #C6F23B;
      color: #1F290F;
      font-weight: 700;
    }
    [data-theme="dark"] .nav-btn.active {
      background-color: #243E12;
      border-color: #C6F23B;
      color: #C6F23B;
    }
    .viewport-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-y: auto;
      background: #E5E1D4;
    }
    .device-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 900px;
      margin-bottom: 16px;
      background: var(--surface);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .device-frame {
      background: var(--surface);
      border-radius: 40px;
      border: 12px solid #1F290F;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      width: 390px;
      height: 800px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .device-status-bar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 700;
      color: #FFFFFF;
      background: #1F290F;
      flex-shrink: 0;
      user-select: none;
    }
    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--background);
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-navbar">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.5px;">
        YO<span style="color: var(--accent);">RESERVO</span>
      </span>
      <span class="badge" style="background: rgba(198, 242, 59, 0.2); color: #C6F23B;">
        UI Designs PoC · Mi Cuenta
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="../index.html" style="font-size: 13px; color: #FFFFFF; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 8px;">
        🏠 Hub Principal
      </a>
      <a href="../auth-ui-designs/index.html" style="font-size: 13px; color: #C6F23B; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px;">
        🔐 Ir a Autenticación UI →
      </a>
      <div style="font-size: 13px; color: #CCD6BF;">
        Diseños fieles a <code style="color: #C6F23B;">poc-yoreservo-client-web-app</code>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="main-layout">
    
    <!-- SIDEBAR NAV -->
    <aside class="sidebar-nav">
      
      <div class="sidebar-section-title">Principal</div>
      <button class="nav-btn active" onclick="loadScreen('profile/profile-hub.html', this)">
        <span>👤</span> Mi Cuenta / Ajustes (Hub)
      </button>
      <button class="nav-btn" onclick="loadScreen('profile/edit-profile.html', this)">
        <span>✏️</span> Editar Perfil
      </button>
      <button class="nav-btn" onclick="loadScreen('security/change-password.html', this)">
        <span>🔒</span> Cambiar Contraseña & Sesiones
      </button>

      <div class="sidebar-section-title">Pagos & Favoritos</div>
      <button class="nav-btn" onclick="loadScreen('payments/payment-methods.html', this)">
        <span>💳</span> Métodos de Pago
      </button>
      <button class="nav-btn" onclick="loadScreen('payments/add-card.html', this)">
        <span>➕</span> Registrar Tarjeta (Interactiva)
      </button>
      <button class="nav-btn" onclick="loadScreen('favorites/favorites.html', this)">
        <span>⭐</span> Canchas Favoritas
      </button>

      <div class="sidebar-section-title">Acerca de & Legal</div>
      <button class="nav-btn" onclick="loadScreen('about/about-app.html', this)">
        <span>ℹ️</span> Acerca de YoReservo
      </button>
      <button class="nav-btn" onclick="loadScreen('about/privacy-policy.html', this)">
        <span>🛡️</span> Políticas de Privacidad
      </button>
      <button class="nav-btn" onclick="loadScreen('about/terms-conditions.html', this)">
        <span>📄</span> Términos y Condiciones
      </button>

      <div class="sidebar-section-title">Soporte & Ayuda</div>
      <button class="nav-btn" onclick="loadScreen('support/support-hub.html', this)">
        <span>💬</span> Centro de Soporte (Hub)
      </button>
      <button class="nav-btn" onclick="loadScreen('support/feedback.html', this)">
        <span>💡</span> Enviar Sugerencias
      </button>
      <button class="nav-btn" onclick="loadScreen('support/report-bug.html', this)">
        <span>🐛</span> Reportar un Error
      </button>

    </aside>

    <!-- WORKSPACE CANVAS -->
    <main class="viewport-canvas">
      
      <!-- TOOLBAR -->
      <div class="device-toolbar">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px; font-weight: 700; color: var(--foreground);" id="screen-title">
            Mi Cuenta (Hub)
          </span>
          <span style="font-size: 12px; color: var(--muted-foreground);" id="screen-file">
            ./profile/profile-hub.html
          </span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- Viewport Mode -->
          <div style="display: inline-flex; background: var(--muted); border-radius: var(--radius-sm); padding: 2px;">
            <button id="btn-mobile" class="btn" style="padding: 4px 10px; font-size: 12px; background: var(--surface); color: var(--foreground);" onclick="setDeviceView('mobile')">
              📱 Móvil
            </button>
            <button id="btn-tablet" class="btn" style="padding: 4px 10px; font-size: 12px; background: transparent; color: var(--muted-foreground);" onclick="setDeviceView('tablet')">
              💻 Tablet
            </button>
            <button id="btn-desktop" class="btn" style="padding: 4px 10px; font-size: 12px; background: transparent; color: var(--muted-foreground);" onclick="setDeviceView('desktop')">
              🖥️ Desktop Split
            </button>
          </div>

          <!-- Theme toggle in iframe -->
          <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="toggleIframeTheme()">
            🌓 Tema (Claro/Oscuro)
          </button>

          <!-- External tab -->
          <a id="open-external-btn" href="profile/profile-hub.html" target="_blank" class="btn btn-primary" style="padding: 6px 14px; font-size: 12px;">
            Abrir en pestaña nueva ↗
          </a>
        </div>
      </div>

      <!-- DEVICE FRAME -->
      <div id="device-frame" class="device-frame">
        <div id="device-status-bar" class="device-status-bar">
          <span>9:30</span>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 11px;">
            <span>📶</span>
            <span>🔋 100%</span>
          </div>
        </div>
        <iframe id="preview-frame" class="preview-iframe" src="profile/profile-hub.html"></iframe>
      </div>

    </main>

  </div>

  <script>
    let activePath = 'profile/profile-hub.html';

    function loadScreen(path, btn) {
      activePath = path;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const iframe = document.getElementById('preview-frame');
      iframe.src = path;

      document.getElementById('screen-title').textContent = btn ? btn.textContent.trim() : path;
      document.getElementById('screen-file').textContent = `./${path}`;
      document.getElementById('open-external-btn').href = path;
    }

    function setDeviceView(mode) {
      const frame = document.getElementById('device-frame');
      const statusBar = document.getElementById('device-status-bar');
      const btnMobile = document.getElementById('btn-mobile');
      const btnTablet = document.getElementById('btn-tablet');
      const btnDesktop = document.getElementById('btn-desktop');

      // Reset button styles
      [btnMobile, btnTablet, btnDesktop].forEach(b => {
        if (b) {
          b.style.background = 'transparent';
          b.style.color = 'var(--muted-foreground)';
        }
      });

      if (mode === 'mobile') {
        frame.style.width = '390px';
        frame.style.height = '800px';
        frame.style.borderRadius = '36px';
        frame.style.borderWidth = '10px';
        statusBar.style.display = 'flex';
        btnMobile.style.background = 'var(--surface)';
        btnMobile.style.color = 'var(--foreground)';
      } else if (mode === 'tablet') {
        frame.style.width = '640px';
        frame.style.height = '840px';
        frame.style.borderRadius = '20px';
        frame.style.borderWidth = '6px';
        statusBar.style.display = 'none';
        btnTablet.style.background = 'var(--surface)';
        btnTablet.style.color = 'var(--foreground)';
      } else if (mode === 'desktop') {
        frame.style.width = '1080px';
        frame.style.maxWidth = '95%';
        frame.style.height = '820px';
        frame.style.borderRadius = '16px';
        frame.style.borderWidth = '4px';
        statusBar.style.display = 'none';
        btnDesktop.style.background = 'var(--surface)';
        btnDesktop.style.color = 'var(--foreground)';
      }
    }

    function toggleIframeTheme() {
      const iframe = document.getElementById('preview-frame');
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const html = doc.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      } catch (e) {
        console.error(e);
      }
    }
  </script>

</body>
</html>
