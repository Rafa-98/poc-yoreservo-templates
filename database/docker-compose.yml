services:
  database:
    image: postgres:16-alpine
    container_name: yoreservo-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yoreservo
    ports:
      - "5433:5432"
    volumes:
      - yoreservo-db-data:/var/lib/postgresql/data

volumes:
  yoreservo-db-data: